name: Build OldChat For AllPlatform for Windows 7

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.19.6"
  PUB_CACHE: ${{ github.workspace }}/.pub-cache

jobs:
  build-windows7-x64:
    name: Build Windows 7 x64
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: x64
          cache: true

      - name: Show tool versions
        shell: pwsh
        run: |
          flutter --version
          dart --version
          cmake --version

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get

      - name: Analyze
        shell: pwsh
        run: flutter analyze lib test --no-fatal-infos --no-fatal-warnings

      - name: Test
        shell: pwsh
        run: flutter test

      - name: Build and package
        shell: pwsh
        run: ./tools/package_windows.ps1 -Architecture x64 -Output dist/windows7x64

      - name: Verify package
        shell: pwsh
        run: |
          $output = Join-Path $PWD "dist/windows7x64"
          $exe = Join-Path $output "OldChatForAllPlatformwindows7x64.exe"
          $zip = Join-Path $PWD "OldChatForAllPlatformwindows7x64.zip"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "Missing executable: $exe" }
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw "Missing archive: $zip" }
          if ((Get-Item -LiteralPath $exe).Length -le 0) { throw "Executable is empty: $exe" }
          if ((Get-Item -LiteralPath $zip).Length -le 0) { throw "Archive is empty: $zip" }
          Get-ChildItem -LiteralPath $output -Recurse | Select-Object FullName,Length

      - name: Upload Windows 7 artifact
        uses: actions/upload-artifact@v4
        with:
          name: OldChat-Windows-7-x64-${{ github.sha }}
          path: |
            dist/windows7x64/**
            OldChatForAllPlatformwindows7x64.zip
          if-no-files-found: error
          retention-days: 14
