name: Build OldChat cross-platform engine

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.19.6'

jobs:
  engine:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
          channel: stable
          cache: true
      - name: Get dependencies
        shell: pwsh
        run: flutter pub get
      - name: Analyze
        shell: pwsh
        run: flutter analyze lib test --no-fatal-infos --no-fatal-warnings
      - name: Test
        shell: pwsh
        run: flutter test
      - name: Build Windows engine
        shell: pwsh
        run: flutter build windows --release
      - name: Verify build
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'build/windows/x64/runner/Release')) { throw 'Windows release bundle was not produced' }
      - name: Upload engine result
        uses: actions/upload-artifact@v4
        with:
          name: OldChat-engine-windows-x64-${{ github.sha }}
          path: build/windows/x64/runner/Release/**
          if-no-files-found: error
