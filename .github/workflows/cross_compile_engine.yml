name: Cross Compile Engine

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md', '*.md']
  pull_request:
    paths-ignore: ['**/*.md', '*.md']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_X64: '3.44.4'
  FLUTTER_ARM64: '3.44.4'

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-24.04
            flutter: FLUTTER_X64
            architecture: x64
          - platform: linux
            runner: ubuntu-24.04
            flutter: FLUTTER_X64
            architecture: x64
          - platform: windows
            runner: windows-2025
            flutter: FLUTTER_X64
            architecture: x64
          - platform: macos
            runner: macos-15-intel
            flutter: FLUTTER_X64
            architecture: x64
          - platform: macos
            runner: macos-15
            flutter: FLUTTER_ARM64
            architecture: arm64
          - platform: ios
            runner: macos-14
            flutter: FLUTTER_ARM64
            architecture: arm64
          - platform: web
            runner: ubuntu-24.04
            flutter: FLUTTER_X64
            architecture: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env[matrix.flutter] }}
          architecture: ${{ matrix.architecture }}
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Linux engine dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libayatana-appindicator3-dev libmpv-dev
      - run: flutter pub get      - name: Prepare Android signing
        if: matrix.platform == 'android'
        run: chmod +x tools/create_android_signing.sh && OLDCHATANDROIDKEYALIAS=oldchatrelease tools/create_android_signing.sh
      - name: Build platform engine
        shell: bash
        run: |
          case '${{ matrix.platform }}' in
            android) flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64 --no-pub -Pandroid.compileSdk=36 -Pandroid.targetSdk=36 ;;
            linux) flutter build linux --release --no-pub ;;
            windows) flutter build windows --release --no-pub ;;
            macos) MACOSX_DEPLOYMENT_TARGET=10.15 flutter build macos --release --no-pub ;;
            ios) flutter build ios --release --no-codesign --no-pub ;;
            web) flutter build web --release --no-pub ;;
          esac
      - name: Record engine result
        shell: bash
        run: |
          printf 'platform=%s\nflutter=%s\nrunner=%s\narchitecture=%s\n' '${{ matrix.platform }}' '${{ env[matrix.flutter] }}' '${{ matrix.runner }}' '${{ matrix.architecture }}' > engine-result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: oldchatengine${{ matrix.platform }}${{ matrix.architecture }}
          path: engine-result.txt
