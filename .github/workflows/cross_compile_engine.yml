name: Cross Compile Engine

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md', '*.md']
  pull_request:
    paths-ignore: ['**/*.md', '*.md']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-24.04
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-2025
          - platform: macos
            runner: macos-15
          - platform: ios
            runner: macos-14
          - platform: web
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Linux engine dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libayatana-appindicator3-dev libmpv-dev
      - run: flutter pub get
      - name: Build platform engine
        shell: bash
        run: |
          case '${{ matrix.platform }}' in
            android) flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64 --no-pub ;;
            linux) flutter build linux --release --no-pub ;;
            windows) flutter build windows --release --no-pub ;;
            macos) MACOSX_DEPLOYMENT_TARGET=10.15 flutter build macos --release --no-pub ;;
            ios) flutter build ios --release --no-codesign --no-pub ;;
            web) flutter build web --release --no-pub ;;
          esac
      - name: Record engine result
        shell: bash
        run: |
          printf 'platform=%s\nflutter=%s\nrunner=%s\n' '${{ matrix.platform }}' '${{ env.FLUTTER_VERSION }}' '${{ matrix.runner }}' > engine-result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: oldchatengine${{ matrix.platform }}
          path: engine-result.txt
