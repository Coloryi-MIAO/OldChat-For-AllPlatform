name: 构建 OldChat 跨平台引擎

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  engine:
    runs-on: windows-2025
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
          channel: stable
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 构建平台产物
        shell: bash
        run: flutter build windows --release

      - name: 验证预期产物
        shell: bash
        run: |
          set -euo pipefail
          test -d build/windows/x64/runner/Release

      - name: 记录引擎结果
        shell: bash
        run: printf 'platform=windows\nflutter=%s\nrunner=windows-2025\narchitecture=x64\n' '${{ env.FLUTTER_VERSION }}' > engine-result.txt

      - name: 上传引擎结果
        uses: actions/upload-artifact@v4
        with:
          name: OldChat 跨平台引擎 windows x64
          path: engine-result.txt