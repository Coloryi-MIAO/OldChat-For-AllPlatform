name: 构建 OldChat 跨平台引擎

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-24.04
            architecture: x64
          - platform: linux
            runner: ubuntu-24.04
            architecture: x64
          - platform: windows
            runner: windows-2025
            architecture: x64
          - platform: ios
            runner: macos-14
            architecture: arm64
          - platform: web
            runner: ubuntu-24.04
            architecture: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: ${{ matrix.architecture }}
          channel: stable
          cache: true
      - name: 安装 Java
        uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: 安装 Linux 构建依赖
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libayatana-appindicator3-dev libmpv-dev dpkg-dev rpm gpg zip
      - name: 安装 AppImage 工具
        if: matrix.platform == 'linux'
        run: |
          curl -L --fail --retry 3 -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool
      - name: 获取依赖
        run: flutter pub get
      - name: 准备 Android 签名
        if: matrix.platform == 'android'
        run: chmod +x tools/create_android_signing.sh && OLDCHATANDROIDKEYALIAS=oldchatrelease tools/create_android_signing.sh
      - name: 构建平台产物
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.platform }}' in
            android) flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64 -Pandroid.compileSdk=36 -Pandroid.targetSdk=36 ;;
            linux) chmod +x tools/package_linux.sh tools/sign_linux.sh && tools/package_linux.sh x64 dist/linuxx64 && tools/sign_linux.sh dist/linuxx64 ;;
            windows) flutter build windows --release ;;
            macos) MACOSX_DEPLOYMENT_TARGET=10.15 flutter build macos --release ;;
            ios) flutter build ios --release --no-codesign ;;
            web) flutter build web --release ;;
          esac
      - name: 验证预期产物
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.platform }}' in
            android) test -s build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk; test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk; test -s build/app/outputs/flutter-apk/app-x86_64-release.apk ;;
            linux) test -s dist/linuxx64/OldChatForAllPlatformlinuxx64.deb; test -s dist/linuxx64/OldChatForAllPlatformlinuxx64.rpm; test -s dist/linuxx64/OldChatForAllPlatformlinuxx64.AppImage ;;
            windows) test -d build/windows/${{ matrix.architecture }}/runner/Release ;;
            ios) find build/ios/iphoneos -maxdepth 1 -type d -name '*.app' | grep -q . ;;
            web) test -f build/web/index.html ;;
          esac
      - name: 记录引擎结果
        shell: bash
        run: printf 'platform=%s\nflutter=%s\nrunner=%s\narchitecture=%s\n' '${{ matrix.platform }}' '${{ env.FLUTTER_VERSION }}' '${{ matrix.runner }}' '${{ matrix.architecture }}' > engine-result.txt
      - name: 上传引擎结果
        uses: actions/upload-artifact@v4
        with:
          name: OldChat 跨平台引擎 ${{ matrix.platform }} ${{ matrix.architecture }}
          path: engine-result.txt
