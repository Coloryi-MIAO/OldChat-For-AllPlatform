name: Build OldChat For AllPlatform

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings
      #- name: Test
        #run: flutter test

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oldchat-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Web
        run: run: flutter build web --release --web-resources-cdn
      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: oldchat-web
          path: build/web

  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    needs: analyze-and-test
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release
      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: oldchat-linux
          path: build/linux/x64/release/bundle

  build-windows:
    name: Build Windows
    runs-on: windows-2025
    needs: analyze-and-test
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: oldchat-windows
          path: build/windows/x64/runner/Release

  build-macos:
    name: Build macOS
    runs-on: macos-14
    needs: analyze-and-test
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build macOS
        run: flutter build macos --release --no-codesign
      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: oldchat-macos
          path: build/macos/Build/Products/Release

  build-ios:
    name: Build iOS unsigned
    runs-on: macos-14
    needs: analyze-and-test
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS
        run: flutter build ios --release --no-codesign
      - name: Upload iOS
        uses: actions/upload-artifact@v4
        with:
          name: oldchat-ios
          path: build/ios/iphoneos
