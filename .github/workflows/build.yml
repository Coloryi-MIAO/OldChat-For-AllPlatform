name: Build OldChat For AllPlatform

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md', '*.md']
  pull_request:
    paths-ignore: ['**/*.md', '*.md']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  analyze-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  build-android:
    needs: analyze-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - name: Create offline release signing key
        shell: bash
        run: |
          chmod +x tools/create_android_signing.sh
          tools/create_android_signing.sh
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64
      - name: Rename Android artifacts
        shell: bash
        run: |
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/android/OldChatForAllPlatform-android-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/android/OldChatForAllPlatform-android-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/android/OldChatForAllPlatform-android-x64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: oldchatandroid
          path: dist/android

  build-linux:
    needs: analyze-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            target: linux-x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libayatana-appindicator3-dev libmpv-dev dpkg-dev rpm gpg zip
      - run: flutter pub get
      - run: flutter build linux --release --target-platform ${{ matrix.target }}
      - name: Build DEB and RPM
        run: |
          chmod +x tools/package_linux.sh tools/sign_linux.sh
          tools/package_linux.sh ${{ matrix.arch }} dist/linux-${{ matrix.arch }}
          tools/sign_linux.sh dist/linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: oldchatlinux-${{ matrix.arch }}
          path: dist/linux-${{ matrix.arch }}

  build-windows:
    needs: analyze-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build and package Windows
        shell: pwsh
        run: ./tools/package_windows.ps1 -Architecture '${{ matrix.arch }}' -Output 'dist/windows-${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: oldchatwindows-${{ matrix.arch }}
          path: OldChatForAllPlatform-windows-${{ matrix.arch }}.zip

  build-macos:
    needs: analyze-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build and package macOS
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.13'
        run: |
          chmod +x tools/package_macos.sh
          tools/package_macos.sh ${{ matrix.arch }} dist/macos-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: oldchatmacos-${{ matrix.arch }}
          path: dist/macos-${{ matrix.arch }}/*.dmg

  build-ios-ipa:
    needs: analyze-and-test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build IPA
        run: |
          if [[ -z "${IOS_EXPORT_OPTIONS_PLIST:-}" ]]; then
            echo 'IOS_EXPORT_OPTIONS_PLIST secret is required for a signed IPA.' >&2
            exit 1
          fi
          flutter build ipa --release --export-options-plist "$IOS_EXPORT_OPTIONS_PLIST"
        env:
          IOS_EXPORT_OPTIONS_PLIST: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST }}
      - uses: actions/upload-artifact@v4
        with:
          name: oldchatios-ipa
          path: build/ios/ipa/*.ipa

  build-web:
    needs: analyze-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: oldchatweb
          path: build/web
