name: oldchat_for_allplatform
description: OldChat For AllPlatform — cross-platform Flutter chat client.
publish_to: 'none'
version: 1.4.7-beta.8+5

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 核心
  dio: ^5.4.0
  cryptography: ^2.9.0
  pointycastle: ^4.0.0
  web_socket_channel: ^2.4.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.20.2

  # UI 扩展
  photo_view: ^0.14.0
  image_picker: ^1.0.0
  file_picker: ^12.0.0
  url_launcher: ^6.2.0
  package_info_plus: ^10.2.1
  webview_flutter: ^4.8.0
  webview_windows: ^0.4.0
  video_player: ^2.13.0
  chewie: ^1.14.1
  video_player_media_kit: ^2.0.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  media_kit_libs_windows_video: ^1.0.11
  win32: ^6.3.0
  ffi: ^2.1.3
  archive: ^4.0.9
  lua_dardo_plus: ^0.3.0
  universal_io: ^2.3.1

  # 桌面功能
  window_manager: ^0.3.0
  tray_manager: ^0.5.2
  flutter_native_timezone: ^2.0.0
  flutter_desktop_notifications: ^1.1.2
  path_provider: ^2.1.0

  # 音频（通知音）
  audioplayers: ^5.2.1
  flutter_local_notifications: ^17.0.0
  win_toast: ^0.4.0
  windows_single_instance: ^1.1.0
  camera_desktop: ^1.2.1
  camera: ^0.12.0+2
  media_kit_libs_android_video: ^1.3.8
  media_kit_libs_ios_video: ^1.1.4
  media_kit_libs_macos_video: ^1.1.4
  media_kit_libs_linux: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/legal/user_service_agreement.txt
  fonts:
    - family: HarmonyOS Sans SC
      fonts:
        - asset: assets/HarmonyOS_Sans_SC_Regular.ttf
          weight: 400
        - asset: assets/HarmonyOS_Sans_SC_Medium.ttf
          weight: 500
