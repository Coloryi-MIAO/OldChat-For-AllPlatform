name: oldchatforallplatform
description: OldChat For AllPlatform — cross-platform Flutter chat client.
publish_to: 'none'
version: 1.4.7-beta.8+5

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 核心
  dio: ^5.4.0
  cryptography: ^2.9.0
  pointycastle: ^4.0.0
  web_socket_channel: ^2.4.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.20.2

  # UI 扩展
  photo_view: ^0.14.0
  image_picker: ^1.0.0
  file_picker: ^12.0.0
  url_launcher: ^6.2.0
  package_info_plus: ^10.2.1
  webview_flutter: ^4.8.0
  webview_windows: ^0.4.0
  video_player: 2.12.0
  chewie: ^1.14.1
  win32: ^6.3.0
  ffi: ^2.1.3
  archive: ^4.0.9
  lua_dardo_plus: ^0.3.0
  universal_io: ^2.3.1
  web: ^1.1.1

  # 桌面功能
  window_manager: ^0.3.0
  tray_manager: ^0.5.2
  flutter_desktop_notifications: ^1.1.2
  path_provider: ^2.1.0

  # 音频（通知音）
  audioplayers: 5.2.1
  flutter_local_notifications: ^17.0.0
  win_toast: ^0.4.0
  windows_single_instance: ^1.1.0
  camera_desktop: ^1.2.1
  camera: 0.11.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: HarmonyOS Sans SC
      fonts:
        - asset: assets/HarmonyOS_Sans_SC_Regular.ttf
          weight: 400
        - asset: assets/HarmonyOS_Sans_SC_Medium.ttf
          weight: 500

# Keep the Apple camera implementation on the stable Objective-C/Swift boundary used by Flutter 3.44.8.
dependency_overrides:
  camera_avfoundation: 0.9.22+9
  video_player_avfoundation: 2.8.10
