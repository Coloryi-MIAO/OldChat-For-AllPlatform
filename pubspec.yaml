name: oldchatforwin7
description: OldChat For win7
publish_to: 'none'
version: 1.4.9-beta.9+8

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 核心
  dio: ^5.4.0
  cryptography: ^2.9.0
  pointycastle: ^4.0.0
  web_socket_channel: ^2.4.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.18.1

  # UI 扩展
  photo_view: ^0.14.0
  image_picker: ^1.0.0
  file_picker: 8.0.5
  url_launcher: ^6.2.0
  package_info_plus: ^4.2.0
  video_player: ^2.8.7
  video_player_media_kit: 1.0.5
  media_kit: 1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_windows_video: ^1.0.11
  chewie: ^1.7.5
  win32: ^5.5.0
  ffi: ^2.1.3
  archive: ^4.0.9
  lua_dardo_plus: ^0.3.0
  universal_io: 2.2.2
  camera: 0.10.6
  web: 0.5.1

  # 桌面功能
  window_manager: ^0.3.9
  tray_manager: ^0.5.3
  path_provider: ^2.1.0

  # 音频（Windows 7 构建不加载 Media Foundation 音频插件）
  flutter_local_notifications: ^17.0.0
  windows_single_instance: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: HarmonyOS Sans SC
      fonts:
        - asset: assets/HarmonyOS_Sans_SC_Regular.ttf
          weight: 400
        - asset: assets/HarmonyOS_Sans_SC_Medium.ttf
          weight: 500
